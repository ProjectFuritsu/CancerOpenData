name: Validate and deploy data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "images/**"
      - "docs/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "images/**"
      - "docs/**"
      - "scripts/**"
      - "worker/**"
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: "Fire drill: deploy, then fail the smoke test on purpose to prove auto-rollback works"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at the same time.
concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci   # root: the build needs swagger-ui-dist
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker

  deploy:
    needs: [validate, test-worker]
    # Pull requests are only checked. Only main deploys.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare settings
        run: |
          missing=""
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing="$missing secret:CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || missing="$missing variable:CLOUDFLARE_ACCOUNT_ID(32-hex)"
          if [[ -n "$missing" ]]; then
            echo "::error title=Cloudflare settings missing::Add:$missing (repo Settings > Secrets and variables > Actions). See README > Deploy setup."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so index.json gets each file's last-changed date
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci   # root: the build needs swagger-ui-dist
      - name: Build static files
        run: node scripts/build-site.mjs
      - name: Deploy Worker
        id: deploy
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy --message "commit ${GITHUB_SHA::7}"
      - name: Smoke test the public URL
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          DRILL: ${{ inputs.rollback_drill }}
        run: |
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::warning title=Smoke test skipped::Set the repo variable PUBLIC_URL to test the public URL after each deploy."
            exit 0
          fi
          bash scripts/smoke-test.sh
          if [[ "$DRILL" == "true" ]]; then
            echo "::warning title=Fire drill::Failing the smoke test on purpose to test auto-rollback."
            exit 1
          fi
      # If the new version is live but broken, go back to the previous version.
      # The run still ends red, so someone looks at it.
      - name: Auto-rollback to the previous version
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: worker
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          npx wrangler rollback -y -m "Auto-rollback: smoke test failed for commit ${GITHUB_SHA::7}"
          echo "::error title=Rolled back::The deploy of ${GITHUB_SHA::7} failed the smoke test, so the previous version is live again. Fix the problem and push again."
          if [[ -n "$PUBLIC_URL" ]]; then
            sleep 10
            live=$(curl -s -m 20 "$PUBLIC_URL/" | grep -o '"version": *"[^"]*"' || echo "unknown")
            echo "Live now: $live"
            echo "**Rolled back.** Smoke test failed for \`${GITHUB_SHA::7}\`; live now: $live" >> "$GITHUB_STEP_SUMMARY"
          fi
