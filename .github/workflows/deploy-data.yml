name: Validate and deploy data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "worker/**"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two deploys at the same time.
concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker

  deploy:
    needs: [validate, test-worker]
    # Pull requests are only checked. Only main deploys.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare settings
        run: |
          missing=""
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing="$missing secret:CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || missing="$missing variable:CLOUDFLARE_ACCOUNT_ID(32-hex)"
          if [[ -n "$missing" ]]; then
            echo "::error title=Cloudflare settings missing::Add:$missing (repo Settings > Secrets and variables > Actions). See README > Deploy setup."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so index.json gets each file's last-changed date
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - name: Snapshot the live data (for the update email)
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SNAPSHOT_DIR: ${{ runner.temp }}/before
        run: node scripts/notify-update.mjs snapshot
      - name: Build static files
        run: node scripts/build-site.mjs
      - name: Deploy Worker
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy --message "commit ${GITHUB_SHA::7}"
      - name: Smoke test the public URL
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::warning title=Smoke test skipped::Set the repo variable PUBLIC_URL to test the public URL after each deploy."
            exit 0
          fi
          bash scripts/smoke-test.sh
      - name: Email the update notice
        # Runs only after the smoke test passed. A mail problem shows as a
        # warning; it doesn't mark the deploy as failed (the data is already live).
        continue-on-error: true
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SNAPSHOT_DIR: ${{ runner.temp }}/before
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
        run: node scripts/notify-update.mjs send
