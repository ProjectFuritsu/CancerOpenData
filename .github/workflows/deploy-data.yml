name: Validate and deploy data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two uploads at the same time.
concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate

  deploy:
    needs: validate
    # Pull requests are only checked. Only main uploads.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The R2 secrets live in this GitHub Environment (repo Settings > Environments).
    environment: R2_ACCESS_KEY_ID
    env:
      BUCKET: ${{ vars.R2_BUCKET }}
      TARGET_NAME: R2
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: auto
      # Avoid checksum errors newer AWS CLI versions can cause on S3-compatible storage.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - name: Check R2 settings
        run: |
          missing=""
          [[ -n "$BUCKET" ]] || missing="$missing variable:R2_BUCKET"
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || missing="$missing secret:R2_ACCESS_KEY_ID"
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || missing="$missing secret:R2_SECRET_ACCESS_KEY"
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || missing="$missing secret:R2_ACCOUNT_ID(32-hex)"
          if [[ -n "$missing" ]]; then
            echo "::error title=R2 settings missing or invalid::Add:$missing (repo Settings > Secrets and variables > Actions). See README > Cloudflare R2 setup."
            exit 1
          fi
          echo "S3_ENDPOINT_URL=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Upload changed files to R2
        run: bash scripts/upload-changed.sh
